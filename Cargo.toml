[package]
name = "swiss"
version = "0.16.0"
edition = "2024"
description = "🐺 Just a script manager"
repository = "https://github.com/TimuriAlvarez/swiss"

[features]
cli = ["dep:clap", "clap?/derive", "dep:tracing", "dep:tracing-subscriber"]
editor = ["dep:gprl", "gprl?/types", "gprl?/fs", "dep:regex", "dep:descape"]
variables = ["dep:gprl", "gprl?/types", "gprl?/fs", "dep:xdg", "dep:memmap2"]
runner = ["dep:gprl", "gprl?/types", "dep:xdg", "dep:lexical-sort", "dep:dirwalk", "dep:derive_more", "derive_more?/display", "dep:temp-file", "dep:anyhow", "variables"]
default = ["cli", "editor", "variables", "runner"]

[dependencies]
clap = { version = "*", optional = true }
tracing = { version = "*", optional = true }
tracing-subscriber = { version = "*", optional = true }
gprl = { version = "*", git = "https://github.com/TimuriAlvarez/gprl.git", optional = true }
regex = { version = "*", optional = true }
descape = { version = "*", optional = true }
anyhow = { version = "*", optional = true }
xdg = { version = "*", optional = true }
memmap2 = { version = "*", optional = true }
lexical-sort = { version = "*", optional = true }
dirwalk = { version = "*", optional = true }
derive_more = { version = "*", optional = true }
temp-file = { version = "*", optional = true }

[dev-dependencies]
rand = { version = "*" }
temp-file = { version = "*" }
